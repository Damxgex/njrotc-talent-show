    <style>
        body {
            font-family: Arial, sans-serif;

            color: white;
        }
        .button {
            background-color: #FFD700;
            border: none;
            color: black;
            padding: 15px 32px;
            text-align: center;
            display: inline-block;
            font-size: 20px;

        .button:hover {
            background-color: #FFA500;

            margin-top: 20px;

</head>
<body>
    <h1>NJROTC Echo Soundboard</h1>
    <button class="button" onclick="playSound('echo')">ECHOS loud, ECHO proud!</button>
    <button class="button" onclick="playSound('cadence')">Cadence</button>
    <button class="button" onclick="playSound('march')">Marching Command</button>
    <button class="button" onclick="playSound('applause')">Applause</button>
    <button class="button" onclick="playSound('airhorn')">Airhorn</button>
    
    <br>
    <input type="file" id="fileInput" accept="audio/*">
    <button class="button" onclick="uploadSound()">Upload Custom Sound</button>
    
    <audio id="echo" src="c:\Users\tyrel\Downloads\Record (online-voice-recorder.com).mp3"></audio>
    <audio id="cadence" src="c:\Users\tyrel\Downloads\Record (online-voice-recorder.com) (1).mp3"></audio>
    <audio id="march" src="march.mp3"></audio>
    <audio id="applause" src="applause.mp3"></audio>
    <audio id="airhorn" src="airhorn.mp3"></audio>
    
    <script>
        function playSound(id) {
            let audio = document.getElementById(id);
            audio.play();
        }
        
        function uploadSound() {
            let file = document.getElementById('fileInput').files[0];
            if (file) {
                let audio = new Audio(URL.createObjectURL(file));
                audio.play();
            }
        }
    </script>
</body>
